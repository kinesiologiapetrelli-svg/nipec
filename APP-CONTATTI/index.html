<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONTATTI NIPEC</title>
<meta name="theme-color" content="#123a63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Archivo";src:url("caratteri/archivo.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --carta:#ffffff; --fondo:#f1f4f7; --riga:#d9e2e9; --riga-forte:#b9c8d4;
  --inchiostro:#16222e; --tenue:#5a6b79; --blu:#1c6ea4; --navy:#123a63; --blu-tenue:#e6eff7;
  --allerta:#a3432e; --allerta-fondo:#faeae6; --avviso:#8a6208; --avviso-fondo:#f8efdb;
  --ok:#1b6e52; --ok-fondo:#e2f1ea; --verde-wa:#1f8a4c;
  --ombra:0 1px 2px rgba(18,58,99,.05), 0 8px 24px rgba(18,58,99,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-tema="chiaro"]){
  --carta:#16212c; --fondo:#0d151d; --riga:#26333f; --riga-forte:#3a4b59;
  --inchiostro:#e9f0f6; --tenue:#9aaab8; --blu:#5aa6d6; --navy:#8ec8ea; --blu-tenue:#152b3a;
  --allerta:#e0917a; --allerta-fondo:#2a1b17; --avviso:#dcb264; --avviso-fondo:#2a2211;
  --ok:#63c19d; --ok-fondo:#122a22; --verde-wa:#3dbf78;
  --ombra:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-tema="scuro"]{
  --carta:#16212c; --fondo:#0d151d; --riga:#26333f; --riga-forte:#3a4b59;
  --inchiostro:#e9f0f6; --tenue:#9aaab8; --blu:#5aa6d6; --navy:#8ec8ea; --blu-tenue:#152b3a;
  --allerta:#e0917a; --allerta-fondo:#2a1b17; --avviso:#dcb264; --avviso-fondo:#2a2211;
  --ok:#63c19d; --ok-fondo:#122a22; --verde-wa:#3dbf78; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--inchiostro);
  font-family:"Archivo",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.foglio{max-width:60rem;margin:0 auto;padding:0 1rem 7rem}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blu)}

/* testata */
.testata{margin:0 -1rem 1rem;padding:1.5rem 1.5rem 1.25rem;background:var(--navy);color:#fff;
  border-radius:0 0 1rem 1rem}
.testata .marchio{display:flex;align-items:center;gap:.6rem;font-size:.68rem;letter-spacing:.3em;
  font-weight:600;opacity:.85;text-transform:uppercase;margin-bottom:.9rem}
.testata h1{font-size:1.6rem;line-height:1.1}
.testata .sotto{font-size:.9rem;color:#cfe2f1;margin-top:.3rem}

/* barra schede */
.schede{position:sticky;top:0;z-index:30;display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none;
  margin:0 -1rem 1.1rem;padding:.45rem 1rem;background:color-mix(in srgb,var(--fondo) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--riga)}
.schede::-webkit-scrollbar{display:none}
.schede button{background:none;border:0;cursor:pointer;white-space:nowrap;border-radius:.45rem;
  padding:.42rem .7rem;font-size:.85rem;font-weight:600;color:var(--tenue)}
.schede button[aria-current="true"]{background:var(--blu-tenue);color:var(--blu)}
.schede .pallina{display:inline-block;min-width:1.2rem;padding:0 .3rem;margin-left:.35rem;border-radius:1rem;
  background:var(--blu);color:#fff;font-size:.7rem;line-height:1.2rem;text-align:center;font-weight:700}

.riquadro{background:var(--carta);border:1px solid var(--riga);border-radius:.8rem;
  box-shadow:var(--ombra);padding:1rem 1.1rem;margin-bottom:.9rem}
.riquadro h2{font-size:1.05rem;margin-bottom:.15rem}
.riquadro .occhiello{font-size:.68rem;letter-spacing:.17em;text-transform:uppercase;font-weight:700;
  color:var(--blu);margin-bottom:.35rem}
.tenue{color:var(--tenue);font-size:.88rem}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--riga-forte);
  background:var(--carta);border-radius:.55rem;padding:.5rem .85rem;font-size:.88rem;font-weight:600;
  cursor:pointer;text-decoration:none;color:var(--inchiostro)}
.btn:hover{border-color:var(--blu)}
.btn.primario{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.wa{background:var(--verde-wa);border-color:var(--verde-wa);color:#fff;font-size:1rem;padding:.7rem 1.1rem}
.btn.pericolo{color:var(--allerta);border-color:var(--allerta)}
.btn.piccolo{padding:.3rem .55rem;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:default}
.fila{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* campi */
label.campo{display:block;margin-bottom:.7rem}
label.campo span{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--tenue);margin-bottom:.25rem}
.inp{width:100%;background:var(--fondo);border:1px solid var(--riga);border-radius:.5rem;
  padding:.5rem .65rem;font-size:.95rem}
.inp:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px color-mix(in srgb,var(--blu) 18%,transparent)}
textarea.inp{min-height:7rem;resize:vertical;line-height:1.5}
.due{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:620px){.due{grid-template-columns:1fr}}

/* la scheda del contatto di oggi */
.giro{background:var(--carta);border:1px solid var(--riga);border-left:4px solid var(--blu);
  border-radius:.7rem;padding:.85rem .95rem;margin-bottom:.7rem;box-shadow:var(--ombra)}
.giro .capo{display:flex;align-items:flex-start;gap:.6rem;flex-wrap:wrap}
.giro .nome{font-weight:700;font-size:1.02rem}
.meta{font-size:.82rem;color:var(--tenue)}
.giro .testo{background:var(--fondo);border:1px solid var(--riga);border-radius:.5rem;
  padding:.6rem .7rem;margin:.6rem 0;font-size:.88rem;white-space:pre-wrap;line-height:1.5}
.giro .azioni{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}

/* stati */
.stato{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;
  padding:.17rem .5rem;border-radius:1rem;text-transform:uppercase;letter-spacing:.05em}
.s-nuovo{background:var(--blu-tenue);color:var(--blu)}
.s-inviato{background:var(--avviso-fondo);color:var(--avviso)}
.s-risposto{background:var(--ok-fondo);color:var(--ok)}
.s-interessato{background:var(--ok-fondo);color:var(--ok)}
.s-no{background:var(--fondo);color:var(--tenue)}
.s-info{background:var(--blu-tenue);color:var(--navy);font-weight:700}
/* La barra di chi hai spuntato resta attaccata in basso allo schermo:
   con cinquecento righe, in fondo alla pagina non la troveresti mai. */
.barra-giu{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;
  border-top:3px solid var(--blu);box-shadow:0 -8px 28px rgba(18,58,99,.16);
  max-height:62vh;overflow:auto;margin:0}
.barra-giu .occhiello{margin-bottom:.1rem}
body.con-barra{padding-bottom:15rem}
.s-errato{background:var(--allerta-fondo);color:var(--allerta)}
.s-stop{background:var(--allerta-fondo);color:var(--allerta)}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);
  padding:.4rem .5rem;border-bottom:1px solid var(--riga)}
td{padding:.45rem .5rem;border-bottom:1px solid var(--riga);vertical-align:middle}
tr:hover td{background:var(--fondo)}

.numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.6rem}
.numero{background:var(--carta);border:1px solid var(--riga);border-radius:.6rem;padding:.7rem .8rem}
.numero .v{font-size:1.45rem;font-weight:700;line-height:1.1}
.numero .e{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:700}

.avviso{border-radius:.6rem;padding:.7rem .85rem;font-size:.86rem;margin-bottom:.8rem;line-height:1.5}
.avviso.giallo{background:var(--avviso-fondo);color:var(--avviso);border:1px solid color-mix(in srgb,var(--avviso) 30%,transparent)}
.avviso.rosso{background:var(--allerta-fondo);color:var(--allerta);border:1px solid color-mix(in srgb,var(--allerta) 30%,transparent)}
.avviso.verde{background:var(--ok-fondo);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.avviso b{font-weight:700}

.vuoto{text-align:center;padding:2.5rem 1rem;color:var(--tenue)}
.vuoto b{display:block;font-size:1.05rem;color:var(--inchiostro);margin-bottom:.3rem}
.nascosto{display:none !important}

.brindisi{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(1rem);
  background:var(--navy);color:#fff;padding:.65rem 1.1rem;border-radius:.6rem;font-size:.88rem;
  box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:90vw}
.brindisi.si{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="foglio">

  <div class="testata">
    <div class="marchio">
      <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
        <path d="M50 10 A40 40 0 1 1 30 15.36" fill="none" stroke="#9fcbe8" stroke-width="8" stroke-linecap="round"/>
        <circle cx="30" cy="15.36" r="5.4" fill="#fff"/>
      </svg>
      <span>NIPEC</span>
    </div>
    <h1>Il giro dei contatti</h1>
    <p class="sotto" id="sottotitolo">Nessun contatto ancora. Si comincia da «Importa».</p>
  </div>

  <nav class="schede" id="schede"></nav>
  <main id="app"></main>
</div>
<div class="brindisi" id="brindisi"></div>
<script>
/* =====================================================================
   CONTATTI NIPEC — il giro dei messaggi
   Tutto in questa pagina. I dati stanno nel browser di questo
   dispositivo: nessun account, nessun server, niente esce da qui.
   ===================================================================== */

const CHIAVE = 'nipec_contatti_v1';
/* Le locandine stanno in una chiave separata, non dentro S. Un'immagine pesa
   mille volte un contatto: se il telefono si riempie, a fallire dev'essere il
   salvataggio di una locandina, mai quello della rubrica. */
const CHIAVE_LOC = 'nipec_contatti_locandine_v1';
/* Dove metto la copia dei dati com'erano prima di un aggiornamento.
   Dichiarata qui in cima: carica() la usa prima ancora che il file finisca
   di leggersi, e una costante dichiarata piu' sotto a quel punto non esiste
   ancora — l'errore sarebbe silenzioso. */
const CHIAVE_PRIMA = 'nipec_contatti_prima_aggiornamento';
const OGGI = () => new Date().toISOString().slice(0,10);

const MODELLI_INIZIALI = [
  { id:'it1', paese:'IT', passo:1, nome:'Primo messaggio',
    testo:"Ciao {nome}, sono Giorgio di NIPEC.\n\nTi scrivo perché adesso i macchinari li diamo anche a noleggio: *500 € al mese*, zero anticipo, zero cauzione, nessun vincolo di durata.\n\nTe la porto il primo del mese e me la paghi il trenta: trenta giorni per lavorarci prima di tirare fuori un euro.\n\nNella locandina ci sono tutte e due le macchine — *Afrodite Multishape* per il corpo e il viso, *Laser Ares* per l'epilazione definitiva. Assistenza tecnica e supporto marketing sono inclusi.\n\nTi interessa che ti spieghi come funziona?" },
  { id:'it2', paese:'IT', passo:2, nome:'Promemoria',
    testo:"Ciao {nome}, ti avevo scritto per il noleggio a 500 al mese.\n\nNiente di urgente. Se in questo periodo non è il momento dimmelo pure e non ti scrivo più.\n\nSe invece vuoi capire, ti mando la scheda tecnica e il contratto: li leggi con calma, prima di parlare di soldi." },
  { id:'it3', paese:'IT', passo:3, nome:'Ultima',
    testo:"Ciao {nome}, ultima volta che ti disturbo.\n\nSe un domani ti serve una macchina — laser, corpo o viso — sai dove trovarmi: 351 846 6025.\n\nBuon lavoro." },
  { id:'al1', paese:'AL', passo:1, nome:'Mesazhi i parë',
    testo:"Përshëndetje {nome}, jam Giorgio nga NIPEC.\n\nPo të shkruaj sepse tani pajisjet i japim edhe me qira: *50.000 lekë në muaj*, pa paradhënie, pa garanci, pa kontratë afati.\n\nTa sjell më 1 të muajit dhe ma paguan më 30: tridhjetë ditë punë para se të nxjerrësh një lek.\n\nNë fletëpalosje i ke të dyja pajisjet — *Afrodite Multishape* për trupin dhe fytyrën, *Laser Ares* për epilimin përfundimtar. Asistenca teknike dhe mbështetja e marketingut janë të përfshira.\n\nTë intereson të ta tregoj si funksionon?" },
  { id:'al2', paese:'AL', passo:2, nome:'Kujtesë',
    testo:"Përshëndetje {nome}, të kisha shkruar për qiranë 50.000 lekë në muaj.\n\nAsgjë urgjente. Nëse tani nuk është momenti, ma thuaj dhe nuk të shkruaj më.\n\nNëse do të kuptosh, të dërgoj skedën teknike dhe kontratën, në shqip: i lexon me qetësi, para se të flasim për para." },
  { id:'al3', paese:'AL', passo:3, nome:'E fundit',
    testo:"Përshëndetje {nome}, hera e fundit që të shqetësoj.\n\nNëse nesër të duhet një pajisje — lazer, trup ose fytyrë — e di ku të më gjesh: +355 69 212 9786.\n\nPunë të mbarë." },
  { id:'it4', paese:'IT', passo:4, nome:'Le informazioni (per chi ha detto sì)',
    testo:"Perfetto {nome}, allora ti mando tutto.\n\nQui sotto trovi la locandina con le macchine e i prezzi. Il noleggio è 500 euro al mese: zero anticipo, zero cauzione, nessun vincolo di durata.\n\nDimmi solo quale ti interessa e che giorni sei in centro, così ti chiamo e ci mettiamo d'accordo." },
  { id:'al4', paese:'AL', passo:4, nome:'Informacionet (për ato që thanë po)',
    testo:"Shumë mirë {nome}, po të dërgoj gjithçka.\n\nKëtu poshtë e ke fletëpalosjen me pajisjet dhe çmimet. Qiraja është 50.000 lekë në muaj: pa paradhënie, pa garanci, pa kontratë afati.\n\nMë thuaj vetëm cila të intereson dhe cilat ditë je në qendër, që të të marr në telefon." },
];

const STATI = ['nuovo','inviato','risposto','interessato','informazioni mandate',
               'non interessato','numero errato','non disturbare'];
const CLASSE = {'nuovo':'s-nuovo','inviato':'s-inviato','risposto':'s-risposto','interessato':'s-interessato',
  'informazioni mandate':'s-info',
  'non interessato':'s-no','numero errato':'s-errato','non disturbare':'s-stop'};

function statoIniziale(){
  return { contatti:[], scarti:[], modelli:JSON.parse(JSON.stringify(MODELLI_INIZIALI)),
    cfg:{ alGiorno:25, attesa1:5, attesa2:7, scheda:'oggi', tema:'auto', raffica:false },
    scelti:[], manuale:[], registro:{} };
}
let S = carica();
function carica(){
  let grezzo = null;
  try{ grezzo = localStorage.getItem(CHIAVE); }catch(e){}
  if(!grezzo) return statoIniziale();

  /* Prima di toccare qualsiasi cosa, metto da parte una copia di come stavano
     i dati. Una volta sola, e non la sovrascrivo mai piu': serve proprio nel
     caso in cui un aggiornamento mio faccia danni. Si recupera da
     Impostazioni, e nel peggiore dei casi dalla console del browser. */
  try{
    if(!localStorage.getItem(CHIAVE_PRIMA)) localStorage.setItem(CHIAVE_PRIMA, grezzo);
  }catch(e){}

  try{
    const o = JSON.parse(grezzo); const d = statoIniziale();
    const st = risistema(Object.assign(d, o, { cfg:Object.assign(d.cfg, o.cfg||{}) }));
    /* Se dopo la risistemazione i contatti sono spariti ma nel file ce n'erano,
       qualcosa e' andato storto: NON vado avanti con la rubrica vuota, perche'
       il primo salvataggio cancellerebbe tutto. Tengo i contatti come stavano. */
    const prima = Array.isArray(o.contatti) ? o.contatti.length : 0;
    if(prima && (!st.contatti || !st.contatti.length)){
      st.contatti = o.contatti;
      st._recuperati = prima;
    }
    return st;
  }catch(e){
    /* La risistemazione e' andata in errore. Salvo il meno possibile: tengo i
       contatti grezzi e segnalo, invece di presentarmi con la rubrica vuota. */
    try{
      const o = JSON.parse(grezzo); const d = statoIniziale();
      d.contatti = Array.isArray(o.contatti) ? o.contatti : [];
      d.modelli  = Array.isArray(o.modelli) && o.modelli.length ? o.modelli : d.modelli;
      d._errore  = String(e && e.message || e);
      return d;
    }catch(e2){ return statoIniziale(); }
  }
}
/* I contatti salvati prima non hanno i campi nuovi. Glieli ricostruisco qui,
   una volta sola, senza perdere niente di quello che c'era. */
function risistema(st){
  st.contatti = Array.isArray(st.contatti) ? st.contatti : [];
  st.scarti   = Array.isArray(st.scarti)   ? st.scarti   : [];
  st.scelti   = Array.isArray(st.scelti)   ? st.scelti   : [];
  st.manuale  = Array.isArray(st.manuale)  ? st.manuale  : [];
  st.modelli  = Array.isArray(st.modelli) && st.modelli.length ? st.modelli
              : JSON.parse(JSON.stringify(MODELLI_INIZIALI));
  // chi aveva già l'app non ha il quarto messaggio: glielo aggiungo senza
  // toccare i tre che ha scritto lui
  MODELLI_INIZIALI.forEach(m => { if(!st.modelli.some(x => x.id === m.id)) st.modelli.push(m); });
  /* Il primo messaggio e' cambiato. A chi ce l'ha ancora com'era — cioe' non
     l'ha mai riscritto — lo aggiorno. A chi se l'e' scritto da solo non tocco
     niente: il suo testo vale piu' del mio. */
  const VECCHI = {
    it1: "Ciao {nome}, sono Giorgio di NIPEC.\n\nTi scrivo perché abbiamo cambiato il modo di dare le macchine: noleggio a 500 euro al mese, zero anticipo, zero cauzione, nessun vincolo di durata.\n\nTe la porto il primo del mese, me la paghi il trenta: trenta giorni per lavorarci prima di tirare fuori un euro.\n\nTi interessa che ti racconti come funziona?",
    al1: "Përshëndetje {nome}, jam nga NIPEC.\n\nTani pajisjet i japim me qira: 50.000 lekë në muaj, pa paradhënie, pa garanci, pa kontratë afati.\n\nTa sjell më 1 të muajit, ma paguan më 30: tridhjetë ditë punë para se të nxjerrësh një lek.\n\nTë intereson të ta tregoj si funksionon?"
  };
  st.modelli.forEach(m => {
    const nuovo = MODELLI_INIZIALI.find(x => x.id === m.id);
    if(nuovo && VECCHI[m.id] && m.testo === VECCHI[m.id]) m.testo = nuovo.testo;
  });
  st.contatti.forEach(c => { try{
    if(c.wa === undefined) c.wa = '';            // '' non si sa · 'si' · 'no'
    if(!Array.isArray(c.storia)){
      c.storia = [];
      // quel poco che sapevamo prima: l'ultimo invio
      if(c.ultimoInvio) c.storia.push({ d:c.ultimoInvio, t:'inviato', p:c.invii||1 });
      if(c.stato && c.stato!=='nuovo' && c.stato!=='inviato')
        c.storia.push({ d:c.ultimoInvio||'', t:c.stato });
    }
    if(c.stato==='numero errato' && c.wa==='') c.wa = 'no';
    if(['risposto','interessato'].includes(c.stato) && c.wa==='') c.wa = 'si';
  }catch(e){ /* un contatto strano non deve far saltare tutta la rubrica */ } });
  return st;
}
function salva(){ try{ localStorage.setItem(CHIAVE, JSON.stringify(S)); }
  catch(e){ brindisi('Spazio pieno: esporta una copia'); } }

/* ---------- le locandine ---------- */
let LOC = caricaLoc();
function caricaLoc(){
  try{ return JSON.parse(localStorage.getItem(CHIAVE_LOC)) || {}; }catch(e){ return {}; }
}
function salvaLoc(){
  try{ localStorage.setItem(CHIAVE_LOC, JSON.stringify(LOC)); return true; }
  catch(e){ brindisi('La locandina non ci sta: scegline una più leggera'); return false; }
}
function locDi(idModello){ return LOC[idModello] || null; }
function pesoBello(b){ b = +b || 0; return b > 999999 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB'; }

/* Rimpicciolisco e comprimo prima di salvare: una foto da telefono pesa 4 MB
   e il magazzino del browser ne regge sì e no cinque. A 1280 pixel una
   locandina si legge benissimo su WhatsApp. */
function comprimi(file, lato, qualita){
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no(new Error('file illeggibile'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => no(new Error('non è un\'immagine'));
      im.onload = () => {
        let w = im.width, h = im.height;
        const s = Math.min(1, lato / Math.max(w, h));
        w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        ok({ dato: cv.toDataURL('image/jpeg', qualita), larghezza: w, altezza: h });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Da immagine salvata a File vero, senza await: navigator.share vuole essere
   chiamato dentro al tocco, e un await in mezzo in certi telefoni lo annulla. */
function aFile(dato, nome){
  const [capo, b64] = String(dato || '').split(',');
  const tipo = (String(capo).match(/data:([^;]+)/) || [, 'image/jpeg'])[1];
  const bin = atob(b64 || ''); const n = bin.length; const arr = new Uint8Array(n);
  for(let i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], nome || 'locandina.jpg', { type: tipo });
}

/* Il testo come parte davvero: se la locandina ha anche un indirizzo in rete,
   il link va in fondo e WhatsApp ci disegna sopra l'anteprima. */
function testoDaMandare(m, c){
  const t = componi(m.testo, c);
  const L = locDi(m.id);
  return (L && L.url) ? t + '\n\n' + L.url : t;
}

/* ---------- utilità ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = () => Math.random().toString(36).slice(2,10);
function brindisi(t){ const e=document.getElementById('brindisi'); e.textContent=t; e.classList.add('si');
  clearTimeout(brindisi.t); brindisi.t=setTimeout(()=>e.classList.remove('si'),2600); }
function giorniDa(data){ if(!data) return 9999;
  return Math.floor((new Date(OGGI()) - new Date(data)) / 86400000); }

/* Il numero come lo vuole WhatsApp: prefisso del paese, niente + e niente spazi.
   L'Italia il suo zero lo tiene (02…, 06…), l'Albania lo perde (069… -> 35569…). */
function numeroWA(grezzo, paese){
  let s = String(grezzo||'').replace(/[^\d+]/g,'');
  if(!s) return '';
  /* Se il numero era già scritto con il + davanti, o con lo 00, il prefisso
     del paese ce l'ha già: non glielo metto una seconda volta. Vale per il
     Kosovo (+383), la Germania, l'Inghilterra — tutti quelli che non sono
     né Italia né Albania e che prima finivano storpiati. */
  const giaInternazionale = /^\+/.test(s) || /^00/.test(s);
  s = s.replace(/^\++/,'').replace(/^00/,'');
  if(/^39\d{8,}$/.test(s) || /^355\d{7,}$/.test(s)) return s;
  if(giaInternazionale) return s;
  if(paese === 'AL'){ return '355' + s.replace(/^0+/,''); }
  return '39' + s;
}
/* Il paese non lo decide il menu a tendina: lo dice il numero stesso.
   Il menu serve solo ai numeri scritti in locale, senza prefisso. */
function paeseDi(num, ripiego){
  if(/^355/.test(num)) return 'AL';
  if(/^383/.test(num)) return 'AL';   // Kosovo: si parla albanese, il messaggio è quello
  if(/^39/.test(num))  return 'IT';
  return ripiego || 'IT';
}

/* Il codice che Giorgio scrive davanti al nome dice già il paese:
     A0323TR  AL0125DR  KOS0425GJ  N0324  IT0424RO
   prefisso + mese/anno + sigla della città. È la fonte più sicura che
   abbiamo, più del menu a tendina: lo legge da lì. */
const PAESE_CODICE = { A:'AL', AL:'AL', KOS:'AL', KS:'AL', N:'IT', IT:'IT' };
function paeseDaNome(nome){
  const m = String(nome || '').match(/^(AL|A|KOS|KS|IT|N)[\s]?[\dO]{4}/i);
  if(!m) return '';
  return PAESE_CODICE[m[1].toUpperCase()] || '';
}

/* Un numero scritto in locale, senza prefisso. 3xx xxx xxxx è un cellulare
   italiano. 06x xxx xxxx è un cellulare albanese — in Italia quel 06 è il
   fisso di Roma, ma su WhatsApp un fisso non serve a niente, quindi davanti
   a 06 + otto cifre la risposta giusta è Albania. */
function paeseDalNumeroLocale(grezzo){
  const d = String(grezzo || '').replace(/\D/g, '');
  if(/^3\d{8,9}$/.test(d))  return 'IT';
  if(/^06\d{8}$/.test(d))   return 'AL';
  return '';
}

/* Tutto quello che sappiamo, dal più attendibile al meno. L'ultimo è il
   menu a tendina: serve solo quando non c'è nessun altro indizio. */
function decidiPaese(grezzo, nome, colonnaPaese, tendina){
  const num = String(grezzo || '').replace(/[^\d+]/g, '');
  if(/^\+?355/.test(num) || /^00355/.test(num)) return 'AL';
  if(/^\+?39\d/.test(num) && !/^\+?390[67]\d{8}$/.test(num)) return 'IT';
  if(colonnaPaese) return colonnaPaese;
  const dn = paeseDaNome(nome);        if(dn) return dn;
  const dl = paeseDalNumeroLocale(num); if(dl) return dl;
  return tendina || 'IT';
}
/* Un numero buono per WhatsApp. Albania: 355 + 6x + 8 cifre.
   Italia: 39 + 3xx + 8 o 9 cifre, oppure un fisso 390…
   Gli altri paesi li accetto se la lunghezza e' plausibile. Il resto
   non lo importo: finisce negli scarti con scritto perche'. */
function numeroBuono(n){
  if(/^355/.test(n)) return /^3556\d{8}$/.test(n);
  // in Italia WhatsApp sta sui cellulari: 3xx. Un fisso non riceve.
  if(/^39/.test(n))  return /^393\d{8,9}$/.test(n);
  return /^\d{10,15}$/.test(n);
}
function perche(n){
  if(!n) return 'nessun numero nella riga';
  if(n.length < 10) return 'troppo corto: ' + numeroBello(n);
  if(n.length > 15) return 'due numeri nella stessa casella: ' + n;
  if(/^355/.test(n)) return 'non e\' un cellulare albanese: ' + numeroBello(n);
  if(/^390/.test(n)) return 'sembra un fisso italiano: su WhatsApp non arriva';
  if(/^39/.test(n))  return 'non e\' un cellulare italiano: ' + numeroBello(n);
  return 'numero fuori formato: ' + n;
}

function numeroBello(n){
  if(!n) return '—';
  if(n.startsWith('355')) return '+355 ' + n.slice(3).replace(/(\d{2})(\d{3})(\d+)/,'$1 $2 $3');
  if(n.startsWith('39'))  return '+39 '  + n.slice(2).replace(/(\d{3})(\d{3})(\d+)/,'$1 $2 $3');
  return '+' + n;
}

/* Il nome come si scrive dentro un messaggio. I nomi copiati da WhatsApp
   arrivano con la tilde davanti (~Kejsi) e a volte con un'emoji attaccata:
   «Përshëndetje ~Kejsi» si legge male. Qui tolgo quella roba, e se del nome
   non resta niente di scrivibile lascio il saluto senza nome. */
function nomeDaScrivere(c){
  let t = String(c.nome || '').replace(/^[~•*\-\s]+/, '');
  t = t.replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}\u{2066}-\u{2069}]/gu, '');
  t = t.replace(/\s+/g, ' ').trim();
  const primo = t.split(' ')[0] || '';
  // un pezzo come «A0323TR» o «N0124» non è un nome: è il codice del giro
  if(/^[A-Za-z]{1,3}\d{3,4}/.test(primo)) return (t.split(' ')[1] || '').trim();
  if(primo.length < 2) return (c.centro || '').trim();
  return primo;
}
function componi(testo, c){
  const nome = nomeDaScrivere(c) || (c.centro||'').trim() || '';
  return String(testo||'')
    .replace(/\{nome\}/g,  nome)
    .replace(/\{centro\}/g, c.centro||'')
    .replace(/\{citta\}/g,  c.citta||'')
    .replace(/\{città\}/g,  c.citta||'')
    // senza nome resterebbe «Ciao , sono Giorgio»: si ricuce la frase
    .replace(/[ \t]+([,.!?])/g, '$1')
    .replace(/[ \t]{2,}/g, ' ');
}

/* ---------- il motore: chi scrivere oggi, e cosa ---------- */
const senzaNome = c => (!(c.nome||'').trim() && !(c.centro||'').trim()) ? 1 : 0;
/* Stati che fermano la sequenza dei tre messaggi a freddo. «interessato» sta
   qui dentro — non deve ricevere il promemoria — ma NON è un vicolo cieco:
   finisce nella coda di chi va seguito (il quarto messaggio, le informazioni). */
const FERMI = ['risposto','interessato','informazioni mandate','non interessato',
               'numero errato','non disturbare'];
/* Chi ha detto sì e aspetta ancora il materiale. */
const DA_SEGUIRE = ['interessato'];

function modelloPer(c, passo){
  const p = c.paese==='AL' ? 'AL' : 'IT';
  return S.modelli.find(m => m.paese===p && m.passo===passo)
      || S.modelli.find(m => m.passo===passo) || null;
}
function prossimoModello(c){
  if(!c.numero) return null;
  if(FERMI.includes(c.stato)) return null;
  const n = c.invii || 0;
  if(n === 0) return modelloPer(c,1);
  const g = giorniDa(c.ultimoInvio);
  if(n === 1 && g >= S.cfg.attesa1) return modelloPer(c,2);
  if(n === 2 && g >= S.cfg.attesa2) return modelloPer(c,3);
  return null;
}
function inviatiOggi(){ return (S.registro[OGGI()]||0); }

/* Chi ha detto sì e aspetta ancora le informazioni. Questa coda NON ha il
   tetto dei messaggi al giorno: rispondere a chi ti ha scritto non è
   contattare uno sconosciuto, e WhatsApp quello non lo conta contro di te. */
function codaDaSeguire(){
  return S.contatti
    .filter(c => DA_SEGUIRE.includes(c.stato) && c.numero)
    .map(c => ({ c, m: modelloPer(c, 4) }))
    .filter(x => x.m)
    .sort((a,b) => String(a.c.ultimoInvio||'').localeCompare(String(b.c.ultimoInvio||'')));
}
function codaCompleta(){
  return S.contatti
    .map(c => ({ c, m: prossimoModello(c) }))
    .filter(x => x.m)
    .sort((a,b) => (a.c.invii||0) - (b.c.invii||0)
                || String(a.c.ultimoInvio||'').localeCompare(String(b.c.ultimoInvio||''))
                || (senzaNome(a.c) - senzaNome(b.c))
                || String(a.c.nome||'').localeCompare(String(b.c.nome||'')));
}
function codaDiOggi(){
  const resto = Math.max(0, S.cfg.alGiorno - inviatiOggi());
  return codaCompleta().slice(0, resto);
}

/* ---------- quello che scegli tu ----------
   La coda automatica decide lei chi e quale messaggio. Questa no: qui dentro
   finisce chi hai spuntato in Rubrica, con il messaggio che hai scelto tu.
   Sta davanti alla coda automatica, ma dentro lo stesso tetto giornaliero:
   il limite dei messaggi al giorno non e' una regola mia, e' quello che
   tiene il numero vivo. */
function codaManuale(){
  return (S.manuale || [])
    .map(x => ({ c: S.contatti.find(k => k.id === x.c), m: S.modelli.find(k => k.id === x.m) }))
    .filter(x => x.c && x.m && x.c.numero);
}
function restoDiOggi(){ return Math.max(0, S.cfg.alGiorno - inviatiOggi()); }

/* Tutto quello che oggi si puo' mandare: prima quello che hai scelto tu,
   poi chi ha detto si', poi la coda automatica. Tagliato al tetto. */
function codaOggi(){
  const m = codaManuale();
  const gia = new Set(m.map(x => x.c.id));
  const a = codaDiOggi().filter(x => !gia.has(x.c.id));
  return m.concat(a).slice(0, restoDiOggi());
}

function scelto(id){ return (S.scelti || []).includes(id); }
function cambiaScelto(id, si){
  S.scelti = (S.scelti || []).filter(x => x !== id);
  if(si) S.scelti.push(id);
  salva(true); 
}
function svuotaScelti(){ S.scelti = []; }

/* Mette in coda le persone spuntate, col messaggio scelto. */
function mettiInCoda(passo){
  const ids = (S.scelti || []).slice();
  if(!ids.length) return brindisi('Non hai spuntato nessuno');
  let aggiunti = 0, saltati = 0;
  ids.forEach(id => {
    const c = S.contatti.find(k => k.id === id);
    if(!c || !c.numero){ saltati++; return; }
    const m = modelloPer(c, passo);
    if(!m){ saltati++; return; }
    S.manuale = (S.manuale || []).filter(x => x.c !== id);
    S.manuale.push({ c:id, m:m.id });
    aggiunti++;
  });
  svuotaScelti();
  S.cfg.scheda = 'oggi'; salva(); disegna();
  const oltre = Math.max(0, aggiunti - restoDiOggi());
  brindisi(`${aggiunti} in coda` + (saltati ? ` · ${saltati} saltati` : '')
    + (oltre ? ` · ${oltre} oltre il tetto di oggi: domani` : ''));
}
function togliDallaCoda(id){
  S.manuale = (S.manuale || []).filter(x => x.c !== id);
  salva(); disegna();
}

function segnaInviato(cid){
  const c = S.contatti.find(x => x.id === cid); if(!c) return;
  c.invii = (c.invii||0) + 1;
  c.ultimoInvio = OGGI();
  // se aspettava le informazioni, adesso le ha: esce dalla coda di chi va seguito
  if(DA_SEGUIRE.includes(c.stato)) c.stato = 'informazioni mandate';
  else if(!FERMI.includes(c.stato)) c.stato = 'inviato';
  (c.storia = c.storia || []).push({ d:OGGI(), t:c.stato === 'informazioni mandate' ? 'informazioni' : 'inviato', p:c.invii });
  S.manuale = (S.manuale || []).filter(x => x.c !== cid);   // fatto: esce dalla coda scelta a mano
  S.registro[OGGI()] = inviatiOggi() + 1;
  salva(); disegna();
}
/* WhatsApp non si fa dare un allegato da un link: wa.me porta solo il testo.
   Quindi due strade, tutte e due vere:
     · la locandina caricata qui dentro parte col foglio di condivisione del
       telefono (immagine + testo insieme, poi scegli WhatsApp e la persona);
     · se la locandina ha anche un indirizzo in rete, il link va in fondo al
       testo e WhatsApp ci disegna sopra l'anteprima: un tocco solo, e la
       persona giusta è già scelta.
   La seconda è più comoda, la prima manda il file vero. */
async function mandaConLocandina(cid, mid){
  const c = S.contatti.find(x => x.id === cid);
  const m = S.modelli.find(x => x.id === mid);
  const L = locDi(mid);
  if(!c || !m || !L || !L.dato) return;
  const testo = testoDaMandare(m, c);
  let f = null;
  try{ f = aFile(L.dato, L.nome); }catch(e){ f = null; }
  if(f && navigator.canShare && navigator.canShare({ files:[f] })){
    try{
      await navigator.share({ files:[f], text: testo });
      segnaInviato(cid);
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;   // ha chiuso lui il foglio
    }
  }
  // ripiego: scarico la locandina e copio il testo, poi apro WhatsApp
  try{
    const a = document.createElement('a');
    a.href = L.dato; a.download = L.nome || 'locandina.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(testo);
    brindisi('Locandina salvata e testo copiato: aprila da WhatsApp e allegala');
  }catch(e){
    brindisi('Questo telefono non sa allegare da solo: usa il link in rete');
  }
}

function cambiaStato(cid, stato){
  const c = S.contatti.find(x => x.id === cid); if(!c) return;
  c.stato = stato;
  (c.storia = c.storia || []).push({ d:OGGI(), t:stato });
  // quello che lo stato dice da solo sul numero, senza chiederglielo due volte
  if(stato === 'numero errato') c.wa = 'no';
  if(['risposto','interessato','non interessato'].includes(stato)) c.wa = 'si';
  salva(); disegna();
  brindisi(c.nome || c.centro || 'Contatto');
}
/* Il numero è su WhatsApp o no. Non si può sapere da qui: lo dice chi ha
   appena aperto la chat, con un tocco. */
function segnaWA(cid, v){
  const c = S.contatti.find(x => x.id === cid); if(!c) return;
  c.wa = v;
  (c.storia = c.storia || []).push({ d:OGGI(), t: v === 'no' ? 'wa-no' : 'wa-si' });
  if(v === 'no' && !FERMI.includes(c.stato)) c.stato = 'numero errato';
  salva(); disegna();
  brindisi(v === 'no' ? 'Segnato: non è su WhatsApp' : 'Segnato: è su WhatsApp');
}
/* Chi ho scritto e sto ancora aspettando: serve al richiamo di ogni giorno. */
function inAttesaDiRisposta(){
  return S.contatti.filter(c => (c.invii||0) > 0 && c.stato === 'inviato');
}
function scrittiIl(giorno){
  return S.contatti.filter(c => (c.storia||[]).some(e => e.t === 'inviato' && e.d === giorno));
}
function ieri(){
  const d = new Date(OGGI()); d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
</script>
<script>
/* =====================  LE SCHERMATE  ===================== */
const app = document.getElementById('app');
const SCHEDE = [
  ['oggi','Oggi'], ['stato','Stato'], ['rubrica','Rubrica'], ['messaggi','Messaggi'],
  ['importa','Importa'], ['impostazioni','Impostazioni']
];

function disegna(){
  // barra delle schede
  const coda = codaDiOggi().length + codaDaSeguire().length;
  const daSegnare = scrittiIl(ieri()).filter(c => c.stato === 'inviato').length
                  + S.scarti.length + prefissiStorti().length;
  document.getElementById('schede').innerHTML = SCHEDE.map(([k,t]) =>
    `<button data-scheda="${k}" aria-current="${S.cfg.scheda===k}">${t}${
      k==='oggi'  && coda       ? `<span class="pallina">${coda}</span>` :
      k==='stato' && daSegnare  ? `<span class="pallina">${daSegnare}</span>` : ''}</button>`).join('');
  // sottotitolo
  const tot = S.contatti.length;
  const st = document.getElementById('sottotitolo');
  st.textContent = tot
    ? `${tot} contatti · ${inviatiOggi()} messaggi mandati oggi · ${codaCompleta().length} in attesa`
    : 'Nessun contatto ancora. Si comincia da «Importa».';
  let avviso = '';
  if(S._errore || S._recuperati){
    avviso = `<div class="avviso rosso"><b>Attenzione: l'aggiornamento non è filato liscio.</b>
      I tuoi ${S.contatti.length} contatti sono qui e non ho salvato niente sopra.
      ${S._errore ? 'Errore: ' + esc(S._errore) + '. ' : ''}
      Vai in <b>Impostazioni</b>, scarica la copia di sicurezza e mandamela:
      <b>non azzerare niente</b>.</div>`;
  }
  app.innerHTML = avviso + ({oggi:vOggi, stato:vStato, rubrica:vRubrica, messaggi:vMessaggi,
                    importa:vImporta, impostazioni:vImpostazioni}[S.cfg.scheda] || vOggi)();
  if(S.cfg.scheda !== 'rubrica') document.body.classList.remove('con-barra');
  if(S.cfg.scheda === 'rubrica') agganciaRubrica();
  if(S.cfg.scheda === 'stato')   agganciaStato();
}

/* ---------- OGGI ---------- */
function vOggi(){
  if(!S.contatti.length) return `<div class="vuoto"><b>Non c'è ancora nessuno in rubrica.</b>
    Vai su <b>Importa</b> e incolla i contatti: nomi e numeri, come capita.</div>`;
  const coda = codaOggi();
  if(S.cfg.raffica && !coda.length) S.cfg.raffica = false;   // finita: si spegne da sola
  const fatti = inviatiOggi(), quota = S.cfg.alGiorno, resto = codaCompleta().length;
  const n = contaStati();
  let h = `<div class="numeri" style="margin-bottom:.9rem">
    <div class="numero"><div class="v">${fatti}<span style="font-size:.9rem;color:var(--tenue)">/${quota}</span></div><div class="e">mandati oggi</div></div>
    <div class="numero"><div class="v">${resto}</div><div class="e">in attesa</div></div>
    <div class="numero"><div class="v" style="color:var(--ok)">${n['risposto']+n['interessato']}</div><div class="e">hanno risposto</div></div>
    <div class="numero"><div class="v">${S.contatti.length}</div><div class="e">in rubrica</div></div>
  </div>`;

  h += bloccoDaSeguire();   // prima di tutto, e anche quando la quota è finita

  if(fatti >= quota){
    h += `<div class="avviso verde"><b>Per oggi hai finito.</b> ${fatti} messaggi mandati.
      Il resto della coda (${resto}) torna domani. Non alzare la quota per finire prima:
      è esattamente così che WhatsApp blocca un numero.</div>`;
    const pross = codaProssima(quota);
    h += testaCoda(pross, true);
    h += strisciaMandati();
    if(pross.length){
      h += `<p class="tenue" style="margin-bottom:.7rem">Le prossime ${pross.length}, nell'ordine in cui
        te le servirò domani. Da qui puoi già spuntarle o toglierle dalla coda.</p>`;
      h += pross.map(({c,m}) => schedaGiro(c, m, true)).join('');
    }
    return h;
  }
  if(!coda.length) return h + strisciaMandati() + `<div class="vuoto"><b>Oggi non c'è nessuno da scrivere.</b>
    I promemoria partono da soli quando scadono i giorni di attesa.</div>`;

  h += strisciaMandati();

  /* Raffica: una scheda per volta, col contatore. WhatsApp non si fa mandare
     venticinque messaggi in un colpo — ogni messaggio vuole il suo invio, e
     non c'e' modo di aggirarlo. Ma almeno l'app ti serve la prossima da sola,
     senza tornare alla lista: due tocchi a testa invece di quattro. */
  if(S.cfg.raffica && coda.length){
    const r = S.raffica || { tot: coda.length, inizio: fatti };
    const fatte = Math.max(0, fatti - r.inizio);
    const {c, m} = coda[0];
    return h + `<div class="riquadro" style="margin-bottom:.9rem;border-left:3px solid var(--verde-wa)">
      <div class="occhiello">Raffica</div>
      <h2>${fatte + 1} di ${r.tot}</h2>
      <p class="tenue" style="margin:.3rem 0 .8rem">Apri, manda, torna qui: ti servo la prossima da sola.
        Ne restano ${coda.length}. <b>Non c'è modo di mandarle tutte in un colpo</b> — WhatsApp vuole
        il tuo invio su ognuna, e non si aggira.</p>
      <div class="fila"><button class="btn" data-azione="esci-raffica">Esci dalla raffica</button></div>
    </div>` + schedaGiro(c, m);
  }

  h += testaCoda(coda, false);
  h += `<p class="tenue" style="margin-bottom:.7rem">Si apre, si rilegge, si manda. Il messaggio è già scritto:
     cambialo pure prima di premere invio, se quella persona merita una riga sua.</p>`;
  h += coda.map(({c,m}) => schedaGiro(c,m)).join('');
  return h;
}

/* La testa della coda: quante sono, spuntale tutte, mandale una dopo l'altra.
   Compare SEMPRE che ci sia una coda — anche a quota finita, perche' e'
   proprio allora che uno la va a cercare. Se il tetto e' pieno i tasti
   restano, ma dicono che si riprende domani. */
function testaCoda(coda, bloccata){
  if(!coda.length) return '';
  const nScelti = coda.filter(({c}) => scelto(c.id)).length;
  const tutte = nScelti === coda.length;
  return `<div class="riquadro" style="margin-bottom:.9rem">
    <div class="fila" style="align-items:center;flex-wrap:wrap">
      <div style="flex:1 1 11rem">
        <b>${coda.length} ${bloccata ? 'pronte per domani' : 'da mandare oggi'}</b>
        <div class="tenue">${nScelti ? nScelti + ' spuntate' : 'nessuna spuntata: vale tutta la coda'}</div>
      </div>
      <button class="btn" data-azione="${tutte ? 'deseleziona' : 'tutte-oggi'}">
        ${tutte ? 'Togli le spunte' : 'Seleziona tutte'}</button>
      ${bloccata
        ? `<button class="btn" data-azione="raffica-piena">Manda una dopo l'altra</button>`
        : `<button class="btn primario" data-azione="raffica">Manda ${nScelti || coda.length} una dopo l'altra</button>`}
    </div>
    ${bloccata ? `<p class="tenue" style="margin-top:.6rem">Oggi hai finito il tetto che ti sei dato.
      Le spunte restano: domani mattina apri e premi <b>Manda una dopo l'altra</b>.
      Se davvero ti serve andare oltre, il tetto si alza in
      <a href="#" data-scheda="impostazioni">Impostazioni</a> — ma pensaci: è la cosa
      che fa bloccare i numeri.</p>` : ''}
  </div>`;
}

/* Chi toccherebbe adesso se il tetto non fosse finito: serve a far vedere
   la coda anche quando per oggi e' chiusa. */
function codaProssima(n){
  const m = codaManuale();
  const gia = new Set(m.map(x => x.c.id));
  return m.concat(codaCompleta().filter(x => !gia.has(x.c.id))).slice(0, n || 25);
}

function contaStati(){

/* ---------- riparazione dei prefissi sbagliati ----------
   Chi ha importato con il menu su «Italia» si ritrova i cellulari albanesi
   con il +39 davanti: il messaggio non arriva, e per di più parte in italiano
   a un centro di Tirana. Qui li trovo e li raddrizzo, uno per uno, dicendo
   prima quanti sono. Non tocco niente senza dirlo. */
function prefissiStorti(){
  return S.contatti.filter(c => {
    const n = String(c.numero || '');
    // 39 + 0 + 6x + otto cifre: è un cellulare albanese travestito da fisso di Roma
    if(/^390[67]\d{8}$/.test(n)) return true;
    // il numero dice una cosa e il campo paese ne dice un'altra
    if(/^355/.test(n) && c.paese !== 'AL') return true;
    if(/^393/.test(n) && c.paese !== 'IT') return true;
    return false;
  });
}
function nuovoNumero(c){
  const n = String(c.numero || '');
  if(/^390[67]\d{8}$/.test(n)) return '355' + n.slice(3).replace(/^0/, '');
  return n;
}
async function correggiPrefissi(){
  const storti = prefissiStorti();
  if(!storti.length) return brindisi('Nessun prefisso da correggere');
  const cambiaNumero = storti.filter(c => nuovoNumero(c) !== c.numero);
  const esistenti = new Set(S.contatti.map(c => c.numero));
  let fatti = 0, doppi = 0;
  storti.forEach(c => {
    const nn = nuovoNumero(c);
    if(nn !== c.numero){
      if(esistenti.has(nn)){ doppi++; return; }   // c'è già: non creo un gemello
      esistenti.delete(c.numero); esistenti.add(nn); c.numero = nn;
    }
    c.paese = paeseDi(c.numero, c.paese);
    fatti++;
  });
  salva(); disegna();
  brindisi(`${fatti} contatti raddrizzati` + (doppi ? ` · ${doppi} erano doppioni, lasciati stare` : ''));
}

/* ---------- STATO: chi ho scritto, quando, e che cosa ne è uscito ----------
   Quello che un'app nel telefono NON può sapere da sola:
     · se un numero è registrato su WhatsApp,
     · se la persona ha risposto.
   WhatsApp non lo dice a nessuno, e non esiste un modo di chiederglielo.
   Quindi non lo indovino: lo chiedo, una volta, nel momento in cui chi manda
   ha la chat davanti agli occhi. Un tocco, e non lo chiedo mai più. */

function ultimoDi(c, tipi){
  const e = (c.storia || []).filter(x => tipi.includes(x.t)).slice(-1)[0];
  return e ? e.d : '';
}
function primoInvio(c){
  const e = (c.storia || []).find(x => x.t === 'inviato');
  return e ? e.d : (c.ultimoInvio || '');
}
function quandoScritto(c){
  if(!(c.invii || 0)) return '<span class="tenue">mai scritta</span>';
  const g = giorniDa(c.ultimoInvio);
  const q = g === 0 ? 'oggi' : g === 1 ? 'ieri' : g + ' giorni fa';
  return esc(dataBella(c.ultimoInvio)) + ' <span class="tenue">· ' + q +
         (c.invii > 1 ? ' · ' + c.invii + ' volte' : '') + '</span>';
}
function dataBella(d){
  if(!d) return '—';
  const [a,m,g] = d.split('-');
  return g + '/' + m;
}
const SEGNO_WA = { si:'<span class="stato s-risposto">sì</span>',

  /* il richiamo di ogni giorno: il lavoro di ieri, da chiudere in dieci tocchi */
  if(daIeri.length){
    h += `<div class="riquadro" style="margin-bottom:.9rem">

      ${daIeri.slice(0,12).map(c => `<div class="fila" style="border-top:1px solid var(--riga);padding:.5rem 0;align-items:center">

        </div>

  }

        <option value="muti">scritte e mai risposto</option>

function agganciaStato(){
  const cerca  = document.getElementById('cercaSt');
  const filtro = document.getElementById('filtroSt');
  if(!cerca || !filtro) return;
  const dipingi = () => {
    const q = (cerca.value || '').toLowerCase().trim();
    const f = filtro.value;
    const regola = {
      scritti:  c => (c.invii||0) > 0,
      attesa:   c => c.stato === 'inviato' && (c.invii||0) > 0,
      risposto: c => RISPOSTE.includes(c.stato),
      muti:     c => (c.invii||0) > 0 && !RISPOSTE.includes(c.stato) && c.wa !== 'no',
      nowa:     c => c.wa === 'no',
      mai:      c => !(c.invii||0),
      tutti:    () => true
    }[f] || (() => true);
    let l = S.contatti.filter(c => regola(c) &&
      (!q || [c.nome, c.centro, c.citta, c.numero].join(' ').toLowerCase().includes(q)));
    l.sort((a,b) => String(b.ultimoInvio||'').localeCompare(String(a.ultimoInvio||'')));
    const tot = l.length; l = l.slice(0, 300);
    document.getElementById('tabellaSt').innerHTML = !tot
      ? `<div class="vuoto">Nessuno con questi filtri.</div>`
      : `<p class="tenue" style="margin-bottom:.4rem">${tot} contatti${tot>300?' — ne mostro i primi 300':''}</p>
        <table><thead><tr><th>Nome</th><th>Scritta il</th><th>WhatsApp</th>
          <th>Stato</th><th>Risposta</th><th></th></tr></thead><tbody>
        ${l.map(c => `<tr>
          <td><b>${esc(c.nome || '—')}</b>
            <div class="meta tenue">${esc([c.centro, c.citta].filter(Boolean).join(' · '))}</div></td>
          <td style="white-space:nowrap">${quandoScritto(c)}</td>

        </tr>`).join('')}</tbody></table>`;
  };
  cerca.addEventListener('input', dipingi);
  filtro.addEventListener('change', dipingi);
  dipingi();
}

/* Il controllo sul testo. Serve a una cosa sola: se manca {nome}, il messaggio

function guardiaTesto(m){
  const t = String(m.testo || '');

  if(!/\{nome\}/.test(t))
    problemi.push('<b>Manca {nome}:</b> il messaggio parte con «Ciao, sono Giorgio», senza il nome di chi lo riceve. Scrivi <b>{nome}</b> dopo «Ciao».');
  if(/\]\(/.test(t))
    problemi.push('<b>C\'è un link fra parentesi quadre:</b> WhatsApp non lo trasforma, lo scrive com\'è. Lascia solo l\'indirizzo.');
  if(/^\*[^\s*]/m.test(t) === false && /^\*\s/m.test(t))
    problemi.push('Gli asterischi a inizio riga WhatsApp li scrive così come sono. Vanno benissimo come elenco — ma se volevi il <b>grassetto</b>, si scrive *senza spazio* attaccato alla parola.');
  if(t.length > 700)
    problemi.push('<b>È lungo:</b> ' + t.length + ' caratteri. Su WhatsApp si legge in piedi, fra una cliente e l\'altra.');
  if(!problemi.length) return '';
  return `<div class="avviso giallo" style="margin:-.4rem 0 .9rem">
    ${problemi.map(x => '<div style="margin:.15rem 0">' + x + '</div>').join('')}</div>`;
}

/* ---------- leggere quello che arriva ----------
   Prima strada: se la prima riga sono intestazioni (Nome, Telefono, Città…)
   leggo le colonne per nome, come farebbe una persona guardando il foglio.
   Così funziona l'export di Google Contatti e qualunque CSV fatto in casa,
   senza bisogno di rimettere le colonne nell'ordine giusto.
   Seconda strada, se intestazioni non ce ne sono: il naso di prima, cioè
   il numero è il pezzo con più cifre e il resto è nome, centro, città. */

const SEP = [';', '\t', ','];

/* Spezza una riga rispettando le virgolette: «"Rossi, Maria";333…»
   resta un pezzo solo, non due. */
function spezza(riga, sep){
  const out = []; let cur = '', dentro = false;
  for(let i = 0; i < riga.length; i++){
    const ch = riga[i];
    if(ch === '"'){
      if(dentro && riga[i+1] === '"'){ cur += '"'; i++; } else dentro = !dentro;
      continue;
    }
    if(ch === sep && !dentro){ out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(x => x.replace(/^\s+|\s+$/g, ''));
}

/* Che separatore usa questo file: quello che spezza tutte le righe nello
   stesso numero di pezzi, e in più di uno. */
function separatoreDi(righe){
  let scelto = null, punti = 0;
  SEP.forEach(sep => {
    const conti = righe.slice(0, 30).map(r => spezza(r, sep).length);
    const n = conti[0] || 0;
    if(n < 2) return;
    const p = conti.filter(c => c === n).length * 100 + n;
    if(p > punti){ punti = p; scelto = sep; }
  });
  return scelto;
}

/* Come si chiamano le colonne che mi servono: in italiano, in inglese e come
   le scrive Google. Dentro ogni lista l'ordine è l'ordine di preferenza —
   se c'è una colonna «WhatsApp» vince su «Telefono». */
const COLONNE = {
  numero:  [/^whatsapp$/i, /^(telefono|numero|cellulare|mobile|tel)\b/i, /^phone\b.*value$/i],
  nome:    [/^nome$/i, /^(first ?name|given ?name)$/i, /^(contatto|cliente|titolare|referente)$/i, /^name$/i],
  cognome: [/^cognome$/i, /^(last ?name|family ?name|surname)$/i],
  centro:  [/^(centro|studio|salone|azienda|attivit)/i, /^organi[zs]ation ?name$/i, /^organi[zs]ation$/i],
  citta:   [/^citt/i, /^(city|comune|localit)/i, /city$/i],
  paese:   [/^(paese|nazione|country)$/i],
  note:    [/^(note|nota|notes)$/i]
};
function mappaColonne(intest){
  const m = {}; const presi = [];
  /* Del telefono prendo TUTTE le colonne che lo somigliano, in ordine di
     preferenza: WhatsApp, poi Telefono, poi Phone 2. Se la prima è vuota
     provo la seconda — altrimenti il contatto sparirebbe in silenzio. */
  m.numeri = [];
  COLONNE.numero.forEach(re => intest.forEach((h, k) => {
    if(re.test(h) && !m.numeri.includes(k)) m.numeri.push(k);
  }));
  presi.push(...m.numeri);
  for(const campo of Object.keys(COLONNE)){
    if(campo === 'numero') continue;
    for(const re of COLONNE[campo]){
      const i = intest.findIndex((h, k) => re.test(h) && !presi.includes(k));
      if(i >= 0){ m[campo] = i; presi.push(i); break; }
    }
  }
  return m;
}

function paeseScritto(v, ripiego){
  const t = String(v || '').trim().toLowerCase();
  if(/^(al|alb|albania|shqip)/.test(t)) return 'AL';
  if(/^(it|ita|italia|italy)/.test(t))  return 'IT';
  return ripiego;
}
/* Google a volte mette due numeri nella stessa casella, separati da ':::'.
   Tengo il primo. */
function primoNumero(v){ return String(v || '').split(':::')[0].trim(); }

function leggiGrezzo(testo, paese){
  const righe = String(testo || '').replace(/^﻿/, '').split(/\r?\n/).filter(r => r.trim());
  if(!righe.length) return { buoni:[], scarti:[], modo:'niente', intest:[] };
  const sep = separatoreDi(righe);
  if(sep){
    const intest = spezza(righe[0], sep);
    const m = mappaColonne(intest);
    if(m.numeri.length && (m.nome !== undefined || m.centro !== undefined))
      return perColonne(righe.slice(1), sep, m, paese, intest);
  }
  return colNaso(righe, paese);
}

function perColonne(righe, sep, m, paese, intest){
  const buoni = [], scarti = [];
  righe.forEach((riga, k) => {
    const pz = spezza(riga, sep);
    const dai = campo => m[campo] === undefined ? '' : (pz[m[campo]] || '').trim();
    const nomeRiga = [dai('nome'), dai('cognome')].filter(Boolean).join(' ').trim();
    // la prima colonna di telefono che ha davvero qualcosa dentro
    let grezzo = '';
    for(const i of m.numeri){ const v = primoNumero(pz[i] || ''); if(v){ grezzo = v; break; } }
    const pa  = decidiPaese(grezzo, nomeRiga, paeseScritto(dai('paese'), ''), paese);
    const num = numeroWA(grezzo, pa);
    if(!num) return;                       // riga davvero senza telefono: non è uno scarto
    const r = { nome: nomeRiga, centro: dai('centro'), citta: dai('citta'),
                note: dai('note'), numero: num, paese: paeseDi(num, pa) };
    if(numeroBuono(num)) buoni.push(r);
    else scarti.push(Object.assign(r, { riga:k + 2, perche: perche(num) }));
  });
  return { buoni, scarti, modo:'colonne', intest };
}

/* Nessuna intestazione: si va a naso, riga per riga. */
function colNaso(righe, paese){
  const buoni = [], scarti = [];
  righe.forEach((riga, k) => {
    const pezzi = riga.split(/\t|;|\s+[–—]\s+|\s{3,}|,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
                      .map(x => x.replace(/^["\s]+|["\s]+$/g, ''));
    let iNum = -1, piu = 0;
    pezzi.forEach((x, i) => { const c = (x.match(/\d/g) || []).length; if(c >= 8 && c > piu){ piu = c; iNum = i; } });
    let num = '', altri = [];
    if(iNum < 0){
      const t = riga.match(/[\d+][\d\s().\-]{7,}/);
      if(!t) return;
      num = numeroWA(t[0], paese);
      const resto = riga.replace(t[0], '').replace(/[;,\t]+/g, ' ').trim();
      altri = resto ? [resto] : [];
    } else {
      altri = pezzi.filter((_, i) => i !== iNum).filter(Boolean);
      if(!altri.length){
        const resto = pezzi[iNum].replace(/[\d+][\d\s().\-]{7,}/, '').replace(/[–—;,]+/g, ' ').trim();
        if(resto) altri = [resto];
      }
      num = numeroWA(primoNumero(pezzi[iNum]), decidiPaese(pezzi[iNum], altri[0] || '', '', paese));
    }
    if(!num) return;
    const r = { nome:altri[0] || '', centro:altri[1] || '', citta:altri[2] || '',
                note:'', numero:num,
                paese:paeseDi(num, decidiPaese(num, altri[0] || '', '', paese)) };
    if(numeroBuono(num)) buoni.push(r);
    else scarti.push(Object.assign(r, { riga:k + 1, perche: perche(num) }));
  });
  return { buoni, scarti, modo:'naso', intest:[] };
}
</script>

/* ---------- uscite ---------- */
function scarica(nome, testo, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([testo], {type:tipo||'text/plain;charset=utf-8'}));
  a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function vcard(){
  const r = [];
  S.contatti.forEach(c => {
    if(!c.numero) return;
    const fn = (c.nome || c.centro || 'Contatto').trim();
    r.push('BEGIN:VCARD','VERSION:3.0','FN:'+fn,'N:;'+fn+';;;');
    if(c.centro) r.push('ORG:'+c.centro);
    r.push('TEL;TYPE=CELL:+'+c.numero);
    if(c.citta) r.push('ADR;TYPE=WORK:;;;'+c.citta+';;;');
    r.push('NOTE:NIPEC','END:VCARD');
  });
  return r.join('\r\n');
}
function csv(){
  const righe = [['nome','centro','citta','telefono','paese','stato','whatsapp',
                  'invii','primo invio','ultimo invio','risposta del','note']];
  S.contatti.forEach(c => righe.push([c.nome,c.centro,c.citta,"'"+c.numero,c.paese,c.stato,
    c.wa === 'si' ? 'si' : c.wa === 'no' ? 'no' : '',
    c.invii||0, primoInvio(c), c.ultimoInvio||'',
    RISPOSTE.includes(c.stato) ? ultimoDi(c, RISPOSTE) : '', c.note||'']));
  return '﻿' + righe.map(r => r.map(v => {
    v = String(v??''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(';')).join('\r\n');
}

/* ---------- i clic ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-scheda],[data-manda],[data-stato],[data-wa],[data-loca],[data-locvia],[data-coda],[data-togli-coda],[data-scarto],[data-azione],[data-apri]');
  if(!t) return;
  if(t.dataset.scheda){ S.cfg.scheda = t.dataset.scheda; salva(); disegna(); return; }
  if(t.dataset.manda){ setTimeout(()=>segnaInviato(t.dataset.manda), 400); return; }   // il link parte lo stesso
  if(t.dataset.stato){ const [s,cid] = t.dataset.stato.split('|'); cambiaStato(cid,s); return; }
  if(t.dataset.wa){ const [v,cid] = t.dataset.wa.split('|'); segnaWA(cid,v); return; }
  if(t.dataset.loca){ const [cid,mid] = t.dataset.loca.split('|'); mandaConLocandina(cid,mid); return; }
  if(t.dataset.coda){ mettiInCoda(parseInt(t.dataset.coda)); return; }
  if(t.dataset.togliCoda){ togliDallaCoda(t.dataset.togliCoda); return; }
  if(t.dataset.locvia){ const mid = t.dataset.locvia;
    if(confirm('Togliere la locandina da questo messaggio?')){ delete LOC[mid]; salvaLoc(); disegna(); } return; }
  if(t.dataset.scarto){ const [az,sid] = t.dataset.scarto.split('|'); gestisciScarto(az,sid); return; }
  if(t.dataset.apri){ apriContatto(t.dataset.apri); return; }
  const a = t.dataset.azione;
  if(a === 'salva-modelli'){
    document.querySelectorAll('[data-modello]').forEach(ta => {
      const m = S.modelli.find(x => x.id === ta.dataset.modello); if(m) m.testo = ta.value;
    });
    document.querySelectorAll('[data-locurl]').forEach(inp => {
      const mid = inp.dataset.locurl, u = inp.value.trim();
      if(u){ LOC[mid] = Object.assign({ dato:'', nome:'', peso:0 }, LOC[mid], { url:u }); }
      else if(LOC[mid]){ LOC[mid].url = ''; if(!LOC[mid].dato) delete LOC[mid]; }
    });
    salvaLoc(); salva(); disegna(); brindisi('Messaggi e link salvati'); return;
  }
  if(a === 'salva-cfg'){
    S.cfg.alGiorno = Math.max(5, Math.min(80, parseInt(document.getElementById('cfgGiorno').value)||25));
    S.cfg.attesa1  = Math.max(2, parseInt(document.getElementById('cfgA1').value)||5);
    S.cfg.attesa2  = Math.max(2, parseInt(document.getElementById('cfgA2').value)||7);
    S.cfg.tema     = document.getElementById('cfgTema').value;
    applicaTema(); salva(); disegna(); brindisi('Salvato'); return;
  }
  if(a === 'anteprima' || a === 'importa'){
    const ris = leggiGrezzo(document.getElementById('grezzo').value,
                            document.getElementById('paeseImp').value);
    if(a === 'anteprima'){ document.getElementById('anteprima').innerHTML = anteprimaHTML(ris); return; }
    importa(ris, document.getElementById('doppioni').value); return;
  }
  if(a === 'prefissi'){ correggiPrefissi(); return; }
  if(a === 'deseleziona'){ svuotaScelti(); salva(); disegna(); return; }
  if(a === 'tutte-oggi'){
    // a quota finita la coda di oggi e' vuota: allora spunta quella di domani
    const l = codaOggi().length ? codaOggi() : codaProssima(S.cfg.alGiorno);
    S.scelti = l.map(x => x.c.id); salva(); disegna(); return;
  }
  if(a === 'raffica'){
    const coda = codaOggi();
    const scelte = coda.filter(x => scelto(x.c.id));
    const batch = scelte.length ? scelte : coda;
    if(!batch.length) return brindisi('Non c\'è niente da mandare');
    // se hai spuntato qualcuno, la raffica manda solo quelli: gli altri tornano in fondo
    if(scelte.length){
      S.manuale = (S.manuale || []).filter(x => batch.some(b => b.c.id === x.c));
      batch.forEach(({c, m}) => {
        if(!(S.manuale || []).some(x => x.c === c.id)) S.manuale.push({ c:c.id, m:m.id });
      });
    }
    S.raffica = { tot: batch.length, inizio: inviatiOggi() };
    S.cfg.raffica = true; svuotaScelti(); salva(); disegna();
    return;
  }
  if(a === 'esci-raffica'){ S.cfg.raffica = false; salva(); disegna(); return; }
  if(a === 'raffica-piena'){
    const ok = confirm(
      'Per oggi hai gia mandato ' + inviatiOggi() + ' messaggi, cioe il tetto che ti sei dato.\n\n' +
      'La coda e pronta: domani mattina apri e parte.\n\n' +
      'Se vuoi alzare il tetto lo cambi in Impostazioni — ma e esattamente la cosa ' +
      'che fa bloccare un numero da WhatsApp.\n\nVuoi andare in Impostazioni?');
    if(ok){ S.cfg.scheda = 'impostazioni'; salva(); disegna(); }
    return;
  }
  if(a === 'scarica-prima'){
    let g = null; try{ g = localStorage.getItem(CHIAVE_PRIMA); }catch(e){}
    if(!g) return brindisi('Non c\'è nessuna copia da scaricare');
    scarica('contatti-prima-aggiornamento-' + OGGI() + '.json', g, 'application/json');
    return;
  }
  if(a === 'torna-prima'){
    let g = null; try{ g = localStorage.getItem(CHIAVE_PRIMA); }catch(e){}
    if(!g) return brindisi('Non c\'è nessuna copia');
    if(!confirm('Tornare alla rubrica com\'era prima dell\'aggiornamento? Quello che hai fatto dopo si perde.')) return;
    try{
      const o = JSON.parse(g);
      S = risistema(Object.assign(statoIniziale(), o, { cfg:Object.assign(statoIniziale().cfg, o.cfg||{}) }));
      salva(); disegna(); brindisi('Rubrica riportata a com\'era');
    }catch(e){ brindisi('La copia non si legge: scaricala e mandamela'); }
    return;
  }
  if(a === 'vcf'){ if(!S.contatti.length) return brindisi('Rubrica vuota');
    scarica('rubrica-nipec.vcf', vcard(), 'text/vcard;charset=utf-8'); brindisi('Aprilo sul telefono'); return; }
  if(a === 'csv'){ scarica('contatti-nipec-'+OGGI()+'.csv', csv(), 'text/csv;charset=utf-8'); return; }
  if(a === 'json'){ scarica('copia-contatti-'+OGGI()+'.json',
      JSON.stringify(Object.assign({}, S, { locandine: LOC }), null, 1), 'application/json'); return; }
  if(a === 'azzera'){
    if(confirm('Cancellare tutti i contatti e lo storico? Esporta prima una copia.') &&
       confirm('Sicuro? Non si torna indietro.')){ S = statoIniziale(); salva(); disegna(); }
    return;
  }
});

/* Che cosa ho capito del file, prima di importarlo davvero. */
function anteprimaHTML(ris){
  const { buoni, scarti, modo, intest } = ris;
  if(!buoni.length && !scarti.length)
    return `<div class="avviso rosso"><b>Non ho trovato nessun numero.</b>
      Serve una riga per persona, con almeno otto cifre di telefono.</div>`;

  const come = modo === 'colonne'
    ? `<div class="avviso verde"><b>Ho riconosciuto le intestazioni.</b>
         Le colonne le leggo per nome, quindi l'ordine non conta:
         ${esc(intest.filter(Boolean).slice(0,8).join(' · '))}${intest.length>8?' …':''}</div>`
    : `<div class="avviso giallo"><b>Intestazioni non ne ho trovate: vado a naso.</b>
         Il numero è il pezzo con più cifre, il resto lo prendo come nome, centro e città.
         Se finisce nella colonna sbagliata, metti una prima riga con scritto
         <b>Nome;Centro;Città;Telefono</b> e ricarica.</div>`;

  const tab = l => `<table><thead><tr><th>Nome</th><th>Centro</th><th>Città</th>
      <th>Numero</th><th>Paese</th></tr></thead><tbody>
    ${l.map(r => `<tr><td>${esc(r.nome)||'<span class="tenue">—</span>'}</td>
      <td class="tenue">${esc(r.centro)}</td><td class="tenue">${esc(r.citta)}</td>
      <td style="white-space:nowrap">${esc(numeroBello(r.numero))}</td>
      <td>${r.paese}</td></tr>`).join('')}</tbody></table>`;

  let h = come + `<p class="tenue" style="margin:.6rem 0 .3rem"><b>${buoni.length} contatti buoni.</b>
    Controlla i primi dieci: devono essere nomi nella colonna dei nomi e numeri in quella dei numeri.</p>`
    + tab(buoni.slice(0,10));

  if(scarti.length) h += `<div class="avviso giallo" style="margin-top:.8rem">
      <b>${scarti.length} righe non le importo</b>, perché il numero non torna. Le tengo da parte:
      le trovi in <b>Stato → numeri da sistemare</b> e le puoi correggere a mano.</div>
    <table><thead><tr><th>Riga</th><th>Nome</th><th>Perché</th></tr></thead><tbody>
    ${scarti.slice(0,8).map(r => `<tr><td class="tenue">${r.riga}</td>
      <td>${esc(r.nome)||'<span class="tenue">—</span>'}</td>
      <td class="tenue">${esc(r.perche)}</td></tr>`).join('')}</tbody></table>`;
  return h;
}

function importa(ris, doppioni){
  const righe = ris.buoni || [];
  if(!righe.length && !(ris.scarti||[]).length) return brindisi('Niente da importare');
  const esistenti = new Map(S.contatti.map(c => [c.numero, c]));
  let nuovi = 0, aggiornati = 0, saltati = 0;
  righe.forEach(r => {
    const g = esistenti.get(r.numero);
    if(g){
      if(doppioni === 'aggiorna'){
        g.nome = r.nome || g.nome; g.centro = r.centro || g.centro;
        g.citta = r.citta || g.citta; g.note = r.note || g.note;
        g.paese = r.paese || g.paese; aggiornati++;
      } else saltati++;
      return;
    }
    const c = { id:id(), nome:r.nome, centro:r.centro, citta:r.citta, note:r.note||'',
                numero:r.numero, paese:r.paese, stato:'nuovo', invii:0, ultimoInvio:'',
                wa:'', storia:[] };
    S.contatti.push(c); esistenti.set(c.numero, c); nuovi++;
  });
  // gli scarti non li butto: restano da sistemare a mano
  (ris.scarti || []).forEach(r => S.scarti.push(Object.assign({ id:id() }, r)));
  salva(); S.cfg.scheda = (ris.scarti||[]).length ? 'stato' : 'oggi'; salva(); disegna();
  brindisi(`${nuovi} nuovi · ${aggiornati} aggiornati · ${saltati} già c'erano`
    + ((ris.scarti||[]).length ? ` · ${ris.scarti.length} da sistemare` : ''));
}

/* I numeri messi da parte dall'importazione: si correggono o si buttano. */
function gestisciScarto(azione, sid){
  const r = S.scarti.find(x => x.id === sid); if(!r) return;
  if(azione === 'butta'){
    S.scarti = S.scarti.filter(x => x.id !== sid);
    salva(); disegna(); brindisi('Buttato'); return;
  }
  const d = document.createElement('dialog');
  d.style.cssText = 'border:0;border-radius:.8rem;padding:1.1rem;max-width:min(26rem,92vw);background:var(--carta);color:var(--inchiostro)';
  d.innerHTML = `<h2 style="margin-bottom:.4rem">${esc(r.nome || 'Numero da sistemare')}</h2>
    <p class="tenue" style="margin-bottom:.7rem">${esc(r.perche || '')}</p>
    <label class="campo"><span>Nome</span><input class="inp" id="sNome" value="${esc(r.nome||'')}"></label>
    <label class="campo"><span>Centro</span><input class="inp" id="sCentro" value="${esc(r.centro||'')}"></label>
    <label class="campo"><span>Città</span><input class="inp" id="sCitta" value="${esc(r.citta||'')}"></label>
    <label class="campo"><span>Numero</span><input class="inp" id="sNum" value="${esc(r.numero||'')}"
      inputmode="tel" placeholder="+355 69 123 4567"></label>
    <label class="campo"><span>Paese</span><select class="inp" id="sPaese">
      <option value="AL" ${r.paese==='AL'?'selected':''}>Albania</option>
      <option value="IT" ${r.paese!=='AL'?'selected':''}>Italia</option></select></label>
    <div class="avviso giallo" id="sAvviso" style="display:none"></div>
    <div class="fila" style="margin-top:.6rem"><button class="btn primario" id="sOk">Salva in rubrica</button>
      <button class="btn" id="sNo">Chiudi</button></div>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector('#sNo').onclick = () => { d.close(); d.remove(); };
  d.querySelector('#sOk').onclick = () => {
    const pa  = d.querySelector('#sPaese').value;
    const num = numeroWA(d.querySelector('#sNum').value, pa);
    const av  = d.querySelector('#sAvviso');
    if(!numeroBuono(num)){
      av.style.display = 'block';
      av.innerHTML = '<b>Il numero ancora non torna.</b> ' + esc(perche(num));
      return;
    }
    if(S.contatti.some(c => c.numero === num)){
      av.style.display = 'block';
      av.innerHTML = '<b>Questo numero è già in rubrica.</b> Se è un doppione, buttalo.';
      return;
    }
    S.contatti.push({ id:id(), nome:d.querySelector('#sNome').value.trim(),
      centro:d.querySelector('#sCentro').value.trim(), citta:d.querySelector('#sCitta').value.trim(),
      note:r.note || '', numero:num, paese:paeseDi(num, pa),
      stato:'nuovo', invii:0, ultimoInvio:'', wa:'', storia:[] });
    S.scarti = S.scarti.filter(x => x.id !== sid);
    salva(); d.close(); d.remove(); disegna(); brindisi('Sistemato e messo in rubrica');
  };
}

function apriContatto(cid){
  const c = S.contatti.find(x => x.id === cid); if(!c) return;
  const d = document.createElement('dialog');
  d.style.cssText = 'border:0;border-radius:.8rem;padding:1.1rem;max-width:min(26rem,92vw);background:var(--carta);color:var(--inchiostro)';
  d.innerHTML = `<h2 style="margin-bottom:.6rem">${esc(c.nome||c.centro||'Contatto')}</h2>
    <label class="campo"><span>Nome</span><input class="inp" id="eNome" value="${esc(c.nome||'')}"></label>
    <label class="campo"><span>Centro</span><input class="inp" id="eCentro" value="${esc(c.centro||'')}"></label>
    <label class="campo"><span>Città</span><input class="inp" id="eCitta" value="${esc(c.citta||'')}"></label>
    <label class="campo"><span>Numero (come lo usa WhatsApp)</span><input class="inp" id="eNum" value="${esc(c.numero||'')}"></label>
    <label class="campo"><span>Stato</span><select class="inp" id="eStato">
      ${STATI.map(s=>`<option ${s===(c.stato||'nuovo')?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="campo"><span>Note</span><textarea class="inp" id="eNote" style="min-height:4rem">${esc(c.note||'')}</textarea></label>
    <div class="fila"><button class="btn primario" id="eOk">Salva</button>
      <button class="btn" id="eNo">Chiudi</button>
      <button class="btn pericolo" id="eDel" style="margin-left:auto">Elimina</button></div>`;
  document.body.appendChild(d); d.showModal();
  d.querySelector('#eNo').onclick = () => { d.close(); d.remove(); };
  d.querySelector('#eOk').onclick = () => {
    c.nome = d.querySelector('#eNome').value; c.centro = d.querySelector('#eCentro').value;
    c.citta = d.querySelector('#eCitta').value; c.note = d.querySelector('#eNote').value;
    c.numero = numeroWA(d.querySelector('#eNum').value, c.paese); c.stato = d.querySelector('#eStato').value;
    salva(); d.close(); d.remove(); disegna(); brindisi('Salvato');
  };
  d.querySelector('#eDel').onclick = () => {
    if(!confirm('Eliminare questo contatto?')) return;
    S.contatti = S.contatti.filter(x => x.id !== cid);
    salva(); d.close(); d.remove(); disegna();
  };
}

/* file in ingresso */
document.addEventListener('change', e => {
  if(e.target.dataset && e.target.dataset.spunta){
    cambiaScelto(e.target.dataset.spunta, e.target.checked);
    disegna();
    return;
  }
  if(e.target.id === 'file'){
    const f = e.target.files[0]; if(!f) return;
    const l = new FileReader();
    l.onload = () => { document.getElementById('grezzo').value = l.result;
      brindisi('Letto. Ora premi «Guarda cosa ho capito»'); };
    l.readAsText(f, 'utf-8'); return;
  }
  if(e.target.dataset && e.target.dataset.locfile){
    const mid = e.target.dataset.locfile;
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    if(!/^image\//.test(f.type)){ brindisi('Serve un\'immagine: JPG o PNG, non un PDF'); return; }
    brindisi('Preparo la locandina…');
    comprimi(f, 1280, .78).then(r => {
      const peso = Math.round((r.dato.length - r.dato.indexOf(',') - 1) * 3 / 4);
      const prima = LOC[mid];
      LOC[mid] = { dato:r.dato, nome:f.name, peso, larghezza:r.larghezza, altezza:r.altezza,
                   url:(prima && prima.url) || '' };
      if(salvaLoc()) brindisi(`Locandina pronta · ${pesoBello(peso)}`);
      else { if(prima) LOC[mid] = prima; else delete LOC[mid]; }
      disegna();
    }).catch(err => brindisi('Non riesco a leggere questa immagine'));
    return;
  }
  if(e.target.id === 'ripristino'){
    const f = e.target.files[0]; if(!f) return;
    const l = new FileReader();
    l.onload = () => { try{ const o = JSON.parse(l.result);
        if(!o.contatti) throw 0;
        if(!confirm('Sostituire quello che c\'è adesso con questa copia?')) return;
        if(o.locandine && typeof o.locandine === 'object'){ LOC = o.locandine; salvaLoc(); }
        delete o.locandine;
        S = risistema(Object.assign(statoIniziale(), o)); salva(); disegna(); brindisi('Copia ripristinata');
      }catch(err){ brindisi('Il file non è una copia valida'); } };
    l.readAsText(f, 'utf-8');
  }
});

function applicaTema(){
  document.documentElement.setAttribute('data-tema', S.cfg.tema === 'auto' ? '' : S.cfg.tema);
}
applicaTema(); disegna();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
